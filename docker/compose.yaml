# Development environment for Omega. Drive it with `./dev.sh` in the repo root
# rather than calling compose directly -- that script fills in the uid/gid and
# git identity that this file expects from the environment.

name: omega-dev

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.23}
        RUST_VERSION: ${RUST_VERSION:-1.94.1}
        LLVM_VERSION: ${LLVM_VERSION:-21}
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
    image: omega-dev:rust${RUST_VERSION:-1.94.1}-alpine${ALPINE_VERSION:-3.23}
    # Reap zombie processes -- Claude Code spawns plenty of short-lived ones.
    init: true
    stdin_open: true
    tty: true
    working_dir: /workspace

    # How many host cores this container may use. `./dev.sh` derives it from
    # OMEGA_CPU_PERCENT (80% of the machine by default) so a busy agent leaves
    # the host responsive; 0 means no limit, which is what driving compose
    # directly gives you.
    cpus: ${OMEGA_CPUS:-0}

    # Passed through from the host only when set. Anything not listed here
    # simply does not exist inside the container.
    environment:
      - ANTHROPIC_API_KEY
      - ANTHROPIC_AUTH_TOKEN
      - ANTHROPIC_BASE_URL
      - ANTHROPIC_MODEL
      - CLAUDE_CODE_USE_BEDROCK
      - CLAUDE_CODE_USE_VERTEX
      - OPENAI_API_KEY
      - GEMINI_API_KEY
      - OPENROUTER_API_KEY
      - AWS_REGION
      - AWS_PROFILE
      - GIT_USER_NAME
      - GIT_USER_EMAIL
      # Read by install-agents.sh, not by the build. Unset means each tool's
      # own default channel; set one to roll a bad release back.
      - CLAUDE_CODE_VERSION
      - CODEX_VERSION
      - OMP_VERSION
      - OPENCODE_VERSION
      - TERM
      - COLORTERM

    volumes:
      # The repo itself. Edits are shared both ways, live.
      - ..:/workspace

      # Where three of the four agents install themselves: ~/.local/bin holds
      # claude, codex (a symlink) and omp, with claude's versioned payload
      # under ~/.local/share/claude. The image ships these directories empty
      # -- install-agents.sh fills them, so an image rebuild never re-downloads
      # a gigabyte of agent, and updating an agent never rebuilds the image.
      - agents:/home/dev/.local

      # opencode installs into a prefix of its own rather than ~/.local/bin.
      - opencode-bin:/home/dev/.opencode

      # Claude Code's entire state: login/credentials, settings, session
      # history, todos. This is what makes `claude` remember you across runs.
      - claude-config:/home/dev/.claude

      # Same idea for Codex CLI: login/credentials and session state, so
      # `codex` remembers you across runs too. This one also holds codex's
      # binary payload, under $CODEX_HOME/packages, which is where its own
      # installer puts it and what ~/.local/bin/codex points at.
      - codex-config:/home/dev/.codex

      # And for omp, whose ~/.omp holds config, credentials, session
      # transcripts, the blob store and its long-term memory -- the part that
      # would hurt most to lose between runs.
      - omp-config:/home/dev/.omp

      # opencode splits its state across two directories rather than one:
      # settings in ~/.config/opencode, and credentials/sessions in
      # ~/.local/share/opencode. The second nests inside the `agents` volume
      # above; Docker resolves the longest matching path first, so it stays a
      # volume of its own and survives an agent reinstall.
      - opencode-config:/home/dev/.config/opencode
      - opencode-data:/home/dev/.local/share/opencode

      # Cargo's download caches, so a rebuilt container does not re-fetch the
      # dependency graph from crates.io.
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git

      # Build artifacts live in a volume rather than in the bind-mounted
      # target/ directory: the container is musl and the host is (probably)
      # glibc, so sharing one target/ would mean both toolchains constantly
      # invalidating each other's artifacts -- and object files produced by
      # `just build-exe` would be linked against the wrong libc.
      - target:/workspace/target

      # Shell history, persisted the same way.
      - history:/commandhistory

volumes:
  agents:
  opencode-bin:
  claude-config:
  codex-config:
  omp-config:
  opencode-config:
  opencode-data:
  cargo-registry:
  cargo-git:
  target:
  history:
