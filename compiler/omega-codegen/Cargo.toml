[package]
name = "omega-codegen"
version = "0.1.0"
edition = "2024"

[dependencies]
omega-hir = { path = "../omega-hir" }
omega-analyzer = { path = "../omega-analyzer" }
omega-mir = { path = "../omega-mir" }
omega-parser = { path = "../omega-parser" }
omega-diagnostics = { path = "../omega-diagnostics" }
# `Target`/`Arch`/`Os` live in `omega-analyzer` (see its `src/target.rs`)
# and are deliberately free of any backend's target vocabulary, so this is
# Cranelift's alone: `cranelift::triple_for` is the only thing in the tree
# that names a `target_lexicon` type, exactly as `llvm::triple_for` is the
# only thing that names LLVM's. Optional, and pulled in by the `cranelift`
# feature below.
target-lexicon = { version = "0.13.5", optional = true }

# Everything below is Cranelift-specific and only pulled in by the
# `cranelift` feature (see `[features]`) -- a future second backend adds
# its own equally self-contained block here, gated by its own feature.
cranelift = { version = "0.131.1", optional = true }
cranelift-module = { version = "0.131.1", optional = true }
cranelift-object = { version = "0.131.1", optional = true }
# The `cranelift` facade crate's own Cargo.toml requests neither `x86` nor
# `arm64` from `cranelift-codegen` explicitly (it happens to work for
# x86_64 today only because some other dependency in the graph already
# requests it) -- depend on `cranelift-codegen` directly, purely to turn
# both on via Cargo's additive feature unification, so `Target::Aarch64`
# (see `target.rs`) is actually buildable, not just structurally present.
cranelift-codegen = { version = "0.131.1", features = ["x86", "arm64"], optional = true }
# Everything below is LLVM-specific and only pulled in by the `llvm`
# feature -- the same self-contained-feature shape the `cranelift` block
# above establishes. `llvm21-1` matches the container's LLVM 21.1.2
# (`/usr/lib/llvm21`, discovered via `llvm-config` on PATH), statically
# linked.
inkwell = { version = "0.10", features = ["llvm21-1"], optional = true }

[features]
default = ["cranelift"]
cranelift = ["dep:cranelift", "dep:cranelift-module", "dep:cranelift-object", "dep:cranelift-codegen", "dep:target-lexicon"]
llvm = ["dep:inkwell"]
